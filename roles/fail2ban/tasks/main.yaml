- name: Ensure fail2ban is installed
  ansible.builtin.apt:
    name: fail2ban
    state: present
- name: Configure fail2ban
  ansible.builtin.template:
    src: fail2ban.j2
    dest: /etc/fail2ban/jail.local
    mode: "0644"
  notify: Restart fail2ban
- name: Enable and start fail2ban service
  ansible.builtin.service:
    name: fail2ban
    enabled: true
    state: started
