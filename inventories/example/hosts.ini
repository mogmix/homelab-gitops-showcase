# Example inventory. The real one has more hosts; these six cover every pattern.
# Addresses are RFC 5737 documentation ranges, not a real network.
hypervisor ansible_host=192.0.2.10   # Proxmox node
proxy      ansible_host=192.0.2.20   # ProxyGuard: internal Traefik + identity
gitops-1   ansible_host=192.0.2.21   # Docker VM: application stacks and Renovate
git        ansible_host=192.0.2.30   # Gitea, LXC
ci-runner  ansible_host=192.0.2.40   # Gitea Actions runner VM (trusted jobs only)
edge       ansible_host=203.0.113.10 # Public VPS (edge Traefik); Ansible connects over public SSH

# Proxmox hypervisor(s): host nodes, not guests.
[proxmox]
hypervisor

# Hosts excluded from the automated update playbook (upgrade + auto-reboot).
[no_auto_update]
hypervisor

# Proxmox LXCs provisioned from Ansible (see playbooks/lifecycle/provision-lxc.yaml).
[lxc]
git

# GitOps reconciler hosts: run Docker stacks from git (see docs/ref/gitops.md).
[gitops]
gitops-1
proxy
edge  # pulls over the tailnet with its own read-only deploy key (see host_vars/edge)

# Host capabilities: bootstrap installs these per group membership.
[docker]
gitops-1
proxy
edge
ci-runner

# git joins so the edge VPS can pull the repo over the tailnet (it can't reach the LAN).
[tailscale]
proxy
git
edge

# Daily Renovate runner (see docs/ref/renovate.md).
[renovate]
gitops-1

# Weekly `docker image prune -af`: Renovate bumps leave superseded tagged images behind.
[docker_prune]
gitops-1
edge
