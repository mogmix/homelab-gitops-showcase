[defaults]
inventory = inventories/example/hosts.ini
deprecation_warnings = True
interpreter_python = auto_silent
roles_path = ./.ansible/roles:./roles
collections_path = ./.ansible/collections
host_key_checking = True
# callbacks_enabled = ansible.posix.profile_tasks, ansible.posix.profile_roles
become_ask_pass = False
# The vault password comes from an operator-local helper (ANSIBLE_VAULT_PASSWORD_FILE),
# never from a file in the repository.
log_path = ./.ansible/ansible.log
remote_tmp = /tmp/.ansible-${USER}/tmp

[ssh_connection]
transfer_method = smart
scp_if_ssh = True
# accept-new: unknown hosts are TOFU'd into ~/.ssh/known_hosts; a changed key fails hard.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=60 -o ServerAliveCountMax=3 -o StrictHostKeyChecking=accept-new
pipelining = True
